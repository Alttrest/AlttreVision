    <script>
      alert("Test: index.html yüklendi ve JavaScript çalışıyor! (Eğer bunu görüyorsanız ekranı geçebilirsiniz)");

         alert("Kritik JS Hatası: " + msg + "\nSatır: " + line);

         alert("Promise Hatası (Gizli Çökme): " + event.reason);
      });
