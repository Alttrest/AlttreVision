<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0; }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .grid-bg { fill: url(#grid); }
    .pulse-elem { animation: pulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="560" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="560" rx="16" class="grid-bg" />

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect width="200" height="26" rx="13" fill="#0f172a" stroke="#00f2fe" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#00f2fe" />
    <text x="28" y="17" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="700">WEBXR / AR STUDIO</text>
  </g>

  <!-- Left Column: Project Identity & Specs -->
  <g transform="translate(60, 115)">
    <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">AlttreVision</text>
    <text x="0" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Spatial WebXR &amp; Augmented Reality 3D Furniture Visualizer</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 100)">
      
        <rect x="0" y="0" width="96" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="48" y="19" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">React 18</text>
        
        <rect x="108" y="0" width="70" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="143" y="19" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="12" font-weight="600">Vite</text>
        
        <rect x="190" y="0" width="204" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="292" y="19" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="600">@google/model-viewer</text>
        
        <rect x="406" y="0" width="87" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text x="449" y="19" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">Express</text>
        
    </g>

    <!-- Metrics Cards -->
    <g transform="translate(0, 160)">
      
        <g transform="translate(0, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">TRACKING</text>
          <text x="14" y="48" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Markerless</text>
        </g>
        
        <g transform="translate(155, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">SCALE</text>
          <text x="14" y="48" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Real 1:1</text>
        </g>
        
        <g transform="translate(310, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">VIEWPORT</text>
          <text x="14" y="48" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">3D + AR</text>
        </g>
        
    </g>

    <!-- Detailed Highlights -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="700">CORE SYSTEM ARCHITECTURE:</text>
      
        <text x="0" y="22" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Markerless WebXR surface detection for iOS Quick Look and...</text>
        
        <text x="0" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Real-time 3D orbital inspection with dimensional measurem...</text>
        
        <text x="0" y="62" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Full Express REST API backend with SQLite product catalog...</text>
        
    </g>
  </g>

  <!-- Right Column: Bespoke Visual Representation -->
  <g transform="translate(680, 50)">
    
        <g transform="translate(60, 40)">
          <!-- Floor Plane Reticle -->
          <ellipse cx="180" cy="270" rx="150" ry="45" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6"/>
          <ellipse cx="180" cy="270" rx="90" ry="28" fill="none" stroke="#38bdf8" stroke-width="2"/>
          <ellipse cx="180" cy="270" rx="30" ry="10" fill="#00f2fe" opacity="0.2"/>

          <!-- 3D Armchair Wireframe -->
          <g transform="translate(80, 80)">
            <polygon points="60,20 140,10 160,80 80,90" fill="#082b47" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
            <polygon points="30,85 170,75 210,130 70,140" fill="#0e3a60" stroke="#00f2fe" stroke-width="2"/>
            <polygon points="20,70 60,65 70,140 30,145" fill="#062238" stroke="#38bdf8" stroke-width="1.5"/>
            <polygon points="160,65 200,60 210,130 170,135" fill="#062238" stroke="#38bdf8" stroke-width="1.5"/>
            <line x1="40" y1="145" x2="30" y2="190" stroke="#38bdf8" stroke-width="3"/>
            <line x1="200" y1="130" x2="210" y2="185" stroke="#38bdf8" stroke-width="3"/>
            
            <line x1="20" y1="45" x2="200" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
            <rect x="90" y="30" width="45" height="16" rx="4" fill="#020d18" stroke="#00f2fe"/>
            <text x="96" y="42" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="700">84 cm</text>
          </g>
        </g>
        
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 515)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="11">REPOSITORY: Alttrest/AlttreVision</text>
    <text x="400" y="22" fill="#64748b" font-family="monospace" font-size="11">MAINTAINER: Ali Turan (@Alttrest)</text>
    <text x="960" y="22" fill="#00f2fe" font-family="monospace" font-size="11">● PRODUCTION VERIFIED</text>
  </g>
</svg>